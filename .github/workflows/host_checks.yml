name: Host checks

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test build tools and native bus contracts
        run: python -m unittest discover -s tests -v
      - name: Check documentation links
        run: python tools/check_docs.py
      - name: Check Python syntax
        run: python -m compileall -q build.py patch.py gen_mqjs_headers.py tools tests
